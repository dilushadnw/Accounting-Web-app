<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Accounting Software</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/customers.css">
</head>
<body>
    <nav class="top-navbar">
        <div class="navbar-left">
            <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
            <div class="logo"><h2>Accounting</h2></div>
        </div>
        <div class="navbar-right">
            <div class="user-menu">
                <button class="user-menu-btn" id="userMenuBtn">
                    <div class="user-avatar"><span id="userInitials">U</span></div>
                    <span class="user-name" id="userName">User</span>
                </button>
                <div class="user-dropdown" id="userDropdown">
                    <a href="#" class="dropdown-item" id="logoutBtn">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="invoices.html" class="nav-item">Invoices</a>
            <a href="expenses.html" class="nav-item">Expenses</a>
            <a href="customers.html" class="nav-item active">Customers</a>
            <a href="reports.html" class="nav-item">Reports</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>Customers</h1>
                <p class="page-subtitle">Manage your customer relationships</p>
            </div>
            <a href="add-customer.html" class="btn-primary">Add Customer</a>
        </div>
        
        <!-- Customer Stats -->
        <div class="customer-stats">
            <div class="stat-card">
                <h3>Total Customers</h3>
                <div class="value" id="totalCustomers">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Owed</h3>
                <div class="value" id="totalOwed">$0.00</div>
            </div>
            <div class="stat-card">
                <h3>Active This Month</h3>
                <div class="value" id="activeCustomers">0</div>
            </div>
        </div>
        
        <!-- Filters -->
        <div class="content-section">
            <div class="customer-filters">
                <input type="text" id="searchFilter" placeholder="Search customers...">
            </div>
            
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Balance Owed</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customersTableBody">
                        <tr>
                            <td colspan="5" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils/currency-utils.js"></script>
    <script src="js/services/firestore-service.js"></script>
    <script src="js/customers.js"></script>
</body>
</html>
