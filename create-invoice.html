    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1>Create Invoice</h1>
            <p class="page-subtitle">Create a new invoice for your customer</p>
        </div>
        
        <!-- Invoice Form -->
        <div class="invoice-form-container">
            <form id="invoiceForm">
                <!-- Invoice Header -->
                <div class="invoice-header-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="invoiceNumber">Invoice Number *</label>
                            <input type="text" id="invoiceNumber" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status">
                                <option value="draft">Draft</option>
                                <option value="sent">Sent</option>
                                <option value="paid">Paid</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="customerName">Customer *</label>
                            <select id="customerName" required>
                                <option value="">Select customer...</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="issueDate">Issue Date *</label>
                            <input type="date" id="issueDate" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="dueDate">Due Date *</label>
                            <input type="date" id="dueDate" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="paymentTerms">Payment Terms</label>
                            <select id="paymentTerms">
                                <option value="Net 15">Net 15</option>
                                <option value="Net 30" selected>Net 30</option>
                                <option value="Net 60">Net 60</option>
                                <option value="Due on Receipt">Due on Receipt</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Line Items -->
                <div class="line-items-section">
                    <h3>Line Items</h3>
                    
                    <div class="table-responsive">
                        <table class="line-items-table" id="lineItemsTable">
                            <thead>
                                <tr>
                                    <th style="width: 40%;">Description</th>
                                    <th style="width: 15%;">Quantity</th>
                                    <th style="width: 20%;">Rate</th>
                                    <th style="width: 20%;">Amount</th>
                                    <th style="width: 5%;"></th>
                                </tr>
                            </thead>
                            <tbody id="lineItemsBody">
                                <!-- Line items will be added here dynamically -->
                            </tbody>
                        </table>
                    </div>
                    
                    <button type="button" class="btn-secondary mt-2" id="addLineItemBtn">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        Add Line Item
                    </button>
                </div>
                
                <!-- Totals Section -->
                <div class="totals-section">
                    <div class="totals-left">
                        <div class="form-group">
                            <label for="notes">Notes</label>
                            <textarea id="notes" rows="4" placeholder="Additional notes or payment instructions..."></textarea>
                        </div>
                    </div>
                    
                    <div class="totals-right">
                        <div class="total-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        
                        <div class="total-row">
                            <div class="total-input-group">
                                <span>Tax:</span>
                                <input type="number" id="taxRate" min="0" max="100" step="0.1" value="0" placeholder="0">
                                <span>%</span>
                            </div>
                            <span id="taxAmount">$0.00</span>
                        </div>
                        
                        <div class="total-row">
                            <div class="total-input-group">
                                <span>Discount:</span>
                                <input type="number" id="discount" min="0" step="0.01" value="0" placeholder="0">
                                <select id="discountType">
                                    <option value="percentage">%</option>
                                    <option value="fixed">$</option>
                                </select>
                            </div>
                            <span id="discountAmount">$0.00</span>
                        </div>
                        
                        <div class="total-row total-final">
                            <strong>Total:</strong>
                            <strong id="total">$0.00</strong>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="button" class="btn-secondary" id="previewBtn">Preview</button>
                    <button type="submit" class="btn-primary" id="saveDraftBtn">Save as Draft</button>
                    <button type="button" class="btn-primary" id="saveSendBtn">Save and Send</button>
                </div>
            </form>
