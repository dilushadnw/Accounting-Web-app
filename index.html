<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Web App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Accounting Web App</h1>
            <div class="user-info" id="userInfo">
                <button id="loginBtn" class="btn-primary">Login</button>
                <button id="logoutBtn" class="btn-secondary" style="display:none;">Logout</button>
            </div>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
            <button class="tab-btn" data-tab="transactions">Transactions</button>
            <button class="tab-btn" data-tab="reports">Reports</button>
        </nav>

        <main>
            <!-- Dashboard Tab -->
            <div id="dashboard" class="tab-content active">
                <h2>Dashboard</h2>
                <div class="dashboard-cards">
                    <div class="card">
                        <h3>Total Income</h3>
                        <p class="amount positive" id="totalIncome">$0.00</p>
                    </div>
                    <div class="card">
                        <h3>Total Expenses</h3>
                        <p class="amount negative" id="totalExpenses">$0.00</p>
                    </div>
                    <div class="card">
                        <h3>Net Balance</h3>
                        <p class="amount" id="netBalance">$0.00</p>
                    </div>
                    <div class="card">
                        <h3>Transaction Count</h3>
                        <p class="count" id="transactionCount">0</p>
                    </div>
                </div>
                <div class="recent-transactions">
                    <h3>Recent Transactions</h3>
                    <div id="recentList" class="transaction-list"></div>
                </div>
            </div>

            <!-- Transactions Tab -->
            <div id="transactions" class="tab-content">
                <h2>Transactions</h2>
                <div class="transaction-form">
                    <h3>Add New Transaction</h3>
                    <form id="transactionForm">
                        <div class="form-group">
                            <label for="description">Description:</label>
                            <input type="text" id="description" name="description" required>
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount:</label>
                            <input type="number" id="amount" name="amount" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="type">Type:</label>
                            <select id="type" name="type" required>
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="category">Category:</label>
                            <select id="category" name="category" required>
                                <option value="salary">Salary</option>
                                <option value="food">Food</option>
                                <option value="transport">Transport</option>
                                <option value="utilities">Utilities</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Date:</label>
                            <input type="date" id="date" name="date" required>
                        </div>
                        <button type="submit" class="btn-primary">Add Transaction</button>
                    </form>
                </div>
                <div class="transaction-list-section">
                    <h3>All Transactions</h3>
                    <div class="filters">
                        <select id="filterType">
                            <option value="all">All Types</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                        <select id="filterCategory">
                            <option value="all">All Categories</option>
                            <option value="salary">Salary</option>
                            <option value="food">Food</option>
                            <option value="transport">Transport</option>
                            <option value="utilities">Utilities</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div id="transactionList" class="transaction-list"></div>
                </div>
            </div>

            <!-- Reports Tab -->
            <div id="reports" class="tab-content">
                <h2>Reports</h2>
                <div class="report-section">
                    <h3>Summary by Category</h3>
                    <div id="categoryReport" class="report-content"></div>
                </div>
                <div class="report-section">
                    <h3>Monthly Summary</h3>
                    <div id="monthlyReport" class="report-content"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Accounting Web App. All rights reserved.</p>
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
