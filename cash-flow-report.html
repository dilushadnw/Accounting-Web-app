<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Flow Report - Accounting Software</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/reports.css">
</head>
<body>
    <nav class="top-navbar">
        <div class="navbar-left">
            <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
            <div class="logo"><h2>Accounting</h2></div>
        </div>
        <div class="navbar-right">
            <div class="user-menu">
                <button class="user-menu-btn" id="userMenuBtn">
                    <div class="user-avatar"><span id="userInitials">U</span></div>
                    <span class="user-name" id="userName">User</span>
                </button>
                <div class="user-dropdown" id="userDropdown">
                    <a href="#" class="dropdown-item" id="logoutBtn">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="invoices.html" class="nav-item">Invoices</a>
            <a href="expenses.html" class="nav-item">Expenses</a>
            <a href="customers.html" class="nav-item">Customers</a>
            <a href="reports.html" class="nav-item active">Reports</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <div class="page-header">
            <h1>Cash Flow Report</h1>
            <div>
                <a href="reports.html" class="btn-secondary">Back to Reports</a>
            </div>
        </div>
        
        <!-- Period Selection -->
        <div class="report-filters">
            <div class="filter-row">
                <label for="periodRange">Period:</label>
                <select id="periodRange">
                    <option value="last_3_months">Last 3 Months</option>
                    <option value="last_6_months">Last 6 Months</option>
                    <option value="last_12_months">Last 12 Months</option>
                    <option value="this_year">This Year</option>
                </select>
                
                <button class="btn-primary" id="generateBtn">Generate Report</button>
            </div>
        </div>
        
        <!-- Chart Container -->
        <div class="content-section">
            <h2>Cash Flow Over Time</h2>
            <div style="max-width: 1000px; margin: 30px auto;">
                <canvas id="cashFlowChart"></canvas>
            </div>
        </div>
        
        <!-- Summary Cards -->
        <div class="dashboard-cards" style="margin-top: 30px;">
            <div class="card">
                <div class="card-icon revenue">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                    </svg>
                </div>
                <div class="card-content">
                    <h3>Opening Balance</h3>
                    <p class="card-amount" id="openingBalance">$0</p>
                </div>
            </div>
            
            <div class="card">
                <div class="card-icon profit">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <h3>Total Inflow</h3>
                    <p class="card-amount" id="totalInflow" style="color: #059669;">$0</p>
                </div>
            </div>
            
            <div class="card">
                <div class="card-icon expenses">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"/>
                    </svg>
                </div>
                <div class="card-content">
                    <h3>Total Outflow</h3>
                    <p class="card-amount" id="totalOutflow" style="color: #dc2626;">$0</p>
                </div>
            </div>
            
            <div class="card">
                <div class="card-icon profit">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <h3>Closing Balance</h3>
                    <p class="card-amount" id="closingBalance">$0</p>
                </div>
            </div>
        </div>
        
        <!-- Export Actions -->
        <div class="report-actions" style="margin-top: 30px;">
            <button class="btn-secondary" onclick="window.print()">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: inline; vertical-align: middle; margin-right: 4px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                </svg>
                Print
            </button>
            <button class="btn-secondary" id="exportCsvBtn">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: inline; vertical-align: middle; margin-right: 4px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Export to CSV
            </button>
        </div>
    </main>
    
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils/currency-utils.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        // Cash Flow Report Logic
        let cashFlowChart = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            initCashFlowReport();
        });
        
        function initCashFlowReport() {
            document.getElementById('generateBtn').addEventListener('click', generateCashFlowReport);
            document.getElementById('exportCsvBtn').addEventListener('click', exportToCSV);
            
            // Load initial report
            generateCashFlowReport();
        }
        
        function generateCashFlowReport() {
            const period = document.getElementById('periodRange').value;
            
            // Sample data - in production, fetch from Firebase
            const months = ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const inflowData = [18500, 21200, 19800, 22400, 20600, 23000];
            const outflowData = [12300, 13800, 12900, 14200, 13500, 14800];
            
            // Calculate cumulative cash flow
            let openingBalance = 35000;
            const balanceData = [openingBalance];
            
            for (let i = 0; i < months.length; i++) {
                const netFlow = inflowData[i] - outflowData[i];
                balanceData.push(balanceData[balanceData.length - 1] + netFlow);
            }
            
            const totalInflow = inflowData.reduce((a, b) => a + b, 0);
            const totalOutflow = outflowData.reduce((a, b) => a + b, 0);
            const closingBalance = balanceData[balanceData.length - 1];
            
            // Update summary cards
            document.getElementById('openingBalance').textContent = formatCurrency(openingBalance);
            document.getElementById('totalInflow').textContent = formatCurrency(totalInflow);
            document.getElementById('totalOutflow').textContent = formatCurrency(totalOutflow);
            document.getElementById('closingBalance').textContent = formatCurrency(closingBalance);
            document.getElementById('closingBalance').style.color = closingBalance >= openingBalance ? '#059669' : '#dc2626';
            
            // Update chart
            updateCashFlowChart(months, inflowData, outflowData, balanceData);
        }
        
        function updateCashFlowChart(labels, inflowData, outflowData, balanceData) {
            const ctx = document.getElementById('cashFlowChart').getContext('2d');
            
            // Destroy existing chart
            if (cashFlowChart) {
                cashFlowChart.destroy();
            }
            
            // Create new chart
            cashFlowChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Start', ...labels],
                    datasets: [
                        {
                            label: 'Cash Balance',
                            data: balanceData,
                            borderColor: '#2563eb',
                            backgroundColor: 'rgba(37, 99, 235, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                padding: 20,
                                font: {
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `Balance: ${formatCurrency(context.parsed.y)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return formatCurrency(value);
                                }
                            }
                        }
                    }
                }
            });
        }
        
        function exportToCSV() {
            const months = ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const inflowData = [18500, 21200, 19800, 22400, 20600, 23000];
            const outflowData = [12300, 13800, 12900, 14200, 13500, 14800];
            
            let balance = 35000;
            let csv = ['Period,Inflow,Outflow,Net Flow,Balance'];
            csv.push(`Opening,,,${balance}`);
            
            months.forEach((month, index) => {
                const inflow = inflowData[index];
                const outflow = outflowData[index];
                const netFlow = inflow - outflow;
                balance += netFlow;
                csv.push(`${month},${inflow},${outflow},${netFlow},${balance}`);
            });
            
            // Download
            const csvContent = csv.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cash-flow-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
