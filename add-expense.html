<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - Accounting Software</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/expenses.css">
</head>
<body>
    <nav class="top-navbar">
        <div class="navbar-left">
            <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
            <div class="logo"><h2>Accounting</h2></div>
        </div>
        <div class="navbar-right">
            <div class="user-menu">
                <button class="user-menu-btn" id="userMenuBtn">
                    <div class="user-avatar"><span id="userInitials">U</span></div>
                    <span class="user-name" id="userName">User</span>
                </button>
                <div class="user-dropdown" id="userDropdown">
                    <a href="#" class="dropdown-item" id="logoutBtn">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="invoices.html" class="nav-item">Invoices</a>
            <a href="expenses.html" class="nav-item active">Expenses</a>
            <a href="customers.html" class="nav-item">Customers</a>
            <a href="reports.html" class="nav-item">Reports</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <div class="page-header">
            <h1>Add Expense</h1>
            <p class="page-subtitle">Record a new business expense</p>
        </div>
        
        <div class="expense-form-container">
            <form id="expenseForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="amount">Amount *</label>
                        <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" required>
                            <option value="">Select category...</option>
                            <option value="Office">Office</option>
                            <option value="Travel">Travel</option>
                            <option value="Meals">Meals</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Supplies">Supplies</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="vendor">Vendor/Merchant *</label>
                        <input type="text" id="vendor" placeholder="Vendor name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="paymentMethod">Payment Method</label>
                        <select id="paymentMethod">
                            <option value="Cash">Cash</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description">Description/Notes</label>
                    <textarea id="description" rows="3" placeholder="Additional details about this expense..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Receipt (Optional)</label>
                    <div class="file-upload" id="fileUpload">
                        <input type="file" id="receipt" accept="image/*">
                        <label for="receipt" class="file-upload-label">
                            <div class="file-upload-icon">
                                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                                </svg>
                            </div>
                            <div>
                                <strong>Click to upload receipt</strong>
                                <p style="color: #64748b; font-size: 14px; margin-top: 4px;">PNG, JPG up to 5MB</p>
                            </div>
                        </label>
                        <img id="previewImage" class="file-preview" style="display: none;">
                    </div>
                </div>
                
                <div class="form-actions">
                    <a href="expenses.html" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary" id="saveBtn">
                        <span class="btn-text">Save Expense</span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                </div>
            </form>
        </div>
    </main>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils/currency-utils.js"></script>
    <script src="js/utils/date-utils.js"></script>
    <script src="js/services/firestore-service.js"></script>
    <script>
        let currentUser = null;
        let selectedFile = null;
        
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                currentUser = user;
                initUI();
                setupForm();
            }
        });
        
        function initUI() {
            // Menu and user setup
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            if (menuToggle && sidebar) {
                menuToggle.addEventListener('click', () => sidebar.classList.toggle('active'));
            }
            
            const userMenuBtn = document.getElementById('userMenuBtn');
            const userDropdown = document.getElementById('userDropdown');
            if (userMenuBtn && userDropdown) {
                userMenuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    userDropdown.classList.toggle('active');
                });
                document.addEventListener('click', () => userDropdown.classList.remove('active'));
            }
            
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                await auth.signOut();
                window.location.href = 'login.html';
            });
            
            if (currentUser.displayName) {
                document.getElementById('userName').textContent = currentUser.displayName;
            }
            const initials = (currentUser.displayName || currentUser.email).substring(0, 2).toUpperCase();
            document.getElementById('userInitials').textContent = initials;
        }
        
        function setupForm() {
            document.getElementById('date').value = getTodayISO();
            
            // File upload preview
            const receiptInput = document.getElementById('receipt');
            const preview = document.getElementById('previewImage');
            
            receiptInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    selectedFile = file;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // Form submission
            document.getElementById('expenseForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await saveExpense();
            });
        }
        
        async function saveExpense() {
            const btn = document.getElementById('saveBtn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoader = btn.querySelector('.btn-loader');
            
            btn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline-block';
            
            try {
                const expense = {
                    date: document.getElementById('date').value,
                    amount: parseFloat(document.getElementById('amount').value),
                    category: document.getElementById('category').value,
                    vendor: document.getElementById('vendor').value,
                    paymentMethod: document.getElementById('paymentMethod').value,
                    description: document.getElementById('description').value,
                    receiptUrl: null
                };
                
                // Upload receipt if exists
                if (selectedFile && storage) {
                    const storageRef = storage.ref();
                    const fileRef = storageRef.child(`receipts/${currentUser.uid}/${Date.now()}_${selectedFile.name}`);
                    await fileRef.put(selectedFile);
                    expense.receiptUrl = await fileRef.getDownloadURL();
                }
                
                if (db) {
                    await saveExpense(currentUser.uid, expense);
                }
                
                alert('Expense saved successfully!');
                window.location.href = 'expenses.html';
            } catch (error) {
                console.error('Error saving expense:', error);
                alert('Error saving expense. Please try again.');
            } finally {
                btn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
