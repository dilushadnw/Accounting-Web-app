<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income vs Expenses - Accounting Software</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/reports.css">
</head>
<body>
    <nav class="top-navbar">
        <div class="navbar-left">
            <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
            <div class="logo"><h2>Accounting</h2></div>
        </div>
        <div class="navbar-right">
            <div class="user-menu">
                <button class="user-menu-btn" id="userMenuBtn">
                    <div class="user-avatar"><span id="userInitials">U</span></div>
                    <span class="user-name" id="userName">User</span>
                </button>
                <div class="user-dropdown" id="userDropdown">
                    <a href="#" class="dropdown-item" id="logoutBtn">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="invoices.html" class="nav-item">Invoices</a>
            <a href="expenses.html" class="nav-item">Expenses</a>
            <a href="customers.html" class="nav-item">Customers</a>
            <a href="reports.html" class="nav-item active">Reports</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <div class="page-header">
            <h1>Income vs Expenses</h1>
            <div>
                <a href="reports.html" class="btn-secondary">Back to Reports</a>
            </div>
        </div>
        
        <!-- Period Selection -->
        <div class="report-filters">
            <div class="filter-row">
                <label for="periodRange">Period:</label>
                <select id="periodRange">
                    <option value="last_6_months">Last 6 Months</option>
                    <option value="last_12_months">Last 12 Months</option>
                    <option value="this_year">This Year</option>
                </select>
                
                <button class="btn-primary" id="generateBtn">Generate Report</button>
            </div>
        </div>
        
        <!-- Chart Container -->
        <div class="content-section">
            <h2>Monthly Comparison</h2>
            <div style="max-width: 1000px; margin: 30px auto;">
                <canvas id="incomeExpenseChart"></canvas>
            </div>
        </div>
        
        <!-- Summary Cards -->
        <div class="dashboard-cards" style="margin-top: 30px;">
            <div class="card card-revenue">
                <div class="card-icon revenue">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                    </svg>
                </div>
                <div class="card-content">
                    <h3>Total Income</h3>
                    <p class="card-amount" id="totalIncome">$0</p>
                </div>
            </div>
            
            <div class="card card-expenses">
                <div class="card-icon expenses">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"/>
                    </svg>
                </div>
                <div class="card-content">
                    <h3>Total Expenses</h3>
                    <p class="card-amount" id="totalExpenses">$0</p>
                </div>
            </div>
            
            <div class="card card-profit">
                <div class="card-icon profit">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <h3>Net Profit</h3>
                    <p class="card-amount" id="netProfit">$0</p>
                </div>
            </div>
        </div>
        
        <!-- Export Actions -->
        <div class="report-actions" style="margin-top: 30px;">
            <button class="btn-secondary" onclick="window.print()">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: inline; vertical-align: middle; margin-right: 4px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                </svg>
                Print
            </button>
            <button class="btn-secondary" id="exportCsvBtn">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: inline; vertical-align: middle; margin-right: 4px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Export to CSV
            </button>
        </div>
    </main>
    
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha512-SIMGYRUjwY8+gKg7nn9EItdD8LCADSDfJNutF9TPrvEo86sQmFMh6MyralfIyhADlajSxqc7G0gs7+MwWF/ogQ==" crossorigin="anonymous"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils/currency-utils.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        // Income vs Expenses Report Logic
        let comparisonChart = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            initIncomeExpenseReport();
        });
        
        function initIncomeExpenseReport() {
            document.getElementById('generateBtn').addEventListener('click', generateComparisonReport);
            document.getElementById('exportCsvBtn').addEventListener('click', exportToCSV);
            
            // Load initial report
            generateComparisonReport();
        }
        
        function generateComparisonReport() {
            const period = document.getElementById('periodRange').value;
            
            // Sample data - in production, fetch from Firebase
            const months = ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const incomeData = [18500, 21200, 19800, 22400, 20600, 23000];
            const expenseData = [12300, 13800, 12900, 14200, 13500, 14800];
            
            const totalIncome = incomeData.reduce((a, b) => a + b, 0);
            const totalExpenses = expenseData.reduce((a, b) => a + b, 0);
            const netProfit = totalIncome - totalExpenses;
            
            // Update summary cards
            document.getElementById('totalIncome').textContent = formatCurrency(totalIncome);
            document.getElementById('totalExpenses').textContent = formatCurrency(totalExpenses);
            document.getElementById('netProfit').textContent = formatCurrency(netProfit);
            document.getElementById('netProfit').style.color = netProfit >= 0 ? '#059669' : '#dc2626';
            
            // Update chart
            updateComparisonChart(months, incomeData, expenseData);
        }
        
        function updateComparisonChart(labels, incomeData, expenseData) {
            const ctx = document.getElementById('incomeExpenseChart').getContext('2d');
            
            // Destroy existing chart
            if (comparisonChart) {
                comparisonChart.destroy();
            }
            
            // Create new chart
            comparisonChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Income',
                            data: incomeData,
                            backgroundColor: '#10b981',
                            borderColor: '#059669',
                            borderWidth: 1
                        },
                        {
                            label: 'Expenses',
                            data: expenseData,
                            backgroundColor: '#ef4444',
                            borderColor: '#dc2626',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                padding: 20,
                                font: {
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.dataset.label}: ${formatCurrency(context.parsed.y)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return formatCurrency(value);
                                }
                            }
                        }
                    }
                }
            });
        }
        
        function exportToCSV() {
            const period = document.getElementById('periodRange').value;
            const months = ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const incomeData = [18500, 21200, 19800, 22400, 20600, 23000];
            const expenseData = [12300, 13800, 12900, 14200, 13500, 14800];
            
            let csv = ['Month,Income,Expenses,Net Profit'];
            
            months.forEach((month, index) => {
                const income = incomeData[index];
                const expense = expenseData[index];
                const profit = income - expense;
                csv.push(`${month},${income},${expense},${profit}`);
            });
            
            // Add totals
            const totalIncome = incomeData.reduce((a, b) => a + b, 0);
            const totalExpenses = expenseData.reduce((a, b) => a + b, 0);
            csv.push(`Total,${totalIncome},${totalExpenses},${totalIncome - totalExpenses}`);
            
            // Download
            const csvContent = csv.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `income-vs-expenses-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
